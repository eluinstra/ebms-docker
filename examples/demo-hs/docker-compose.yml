services:
  digipoort:
    image: eluinstra/ebms-adapter-bin:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      ebms_jdbc_update: "true"
    command: "./start.sh -h2 -soap -health"
    expose:
      - 8080
      - 8888
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  digipoort_init:
    image: alpine/curl:latest
    depends_on:
      digipoort:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://digipoort:8080/service/rest/v19/cpas?overwrite=true
      "
  overheid:
    image: eluinstra/ebms-adapter-pg:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      cache_type: "PLUGIN"
      deliveryManager_type: "JMS"
      eventListener_type: "JMS"
      jms_brokerURL: "tcp://activemq:61616"
      ebms_jdbc_update: "true"
      ebms_jdbc_driverClassName: org.postgresql.Driver
      ebms_jdbc_url: "jdbc:postgresql://postgres:5432/ebms"
      ebms_jdbc_username: "ebms"
      ebms_jdbc_password: "ebms"
      ebms_pool_minPoolSize: "4"
      ebms_pool_maxPoolSize: "4"
    command: "./start.sh -headless -disableEbMSClient"
    expose:
      - 8888
    depends_on:
      - activemq
      - postgres
  client:
    image: eluinstra/ebms-adapter-pg:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      cache_type: "PLUGIN"
      deliveryManager_type: "JMS"
      eventListener_type: "JMS"
      jms_brokerURL: "tcp://activemq:61616"
      ebms_jdbc_update: "true"
      ebms_jdbc_driverClassName: org.postgresql.Driver
      ebms_jdbc_url: "jdbc:postgresql://postgres:5432/ebms"
      ebms_jdbc_username: "ebms"
      ebms_jdbc_password: "ebms"
      ebms_pool_minPoolSize: "4"
      ebms_pool_maxPoolSize: "4"
    command: "./start.sh -headless -disableEbMSServer"
    depends_on:
      - activemq
      - postgres
  api:
    image: eluinstra/ebms-adapter-pg:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      cache_type: "PLUGIN"
      deliveryManager_type: "JMS"
      eventListener_type: "JMS"
      jms_brokerURL: "tcp://activemq:61616"
      ebms_jdbc_update: "true"
      ebms_jdbc_driverClassName: org.postgresql.Driver
      ebms_jdbc_url: "jdbc:postgresql://postgres:5432/ebms"
      ebms_jdbc_username: "ebms"
      ebms_jdbc_password: "ebms"
      ebms_pool_minPoolSize: "4"
      ebms_pool_maxPoolSize: "4"
    command: "./start.sh -ssl -soap -disableEbMSServer -disableEbMSClient -health"
    expose:
      - 8443
    ports:
      - "8443:8443"
    depends_on:
      - activemq
      - postgres
        #   healthcheck:
        #     test: "curl -f http://localhost:8008/health"
        #     start_period: 3s
        #     interval: 5s
        #     timeout: 5s
        #     retries: 10
        # overheid_init:
        #   image: alpine/curl:latest
        #   depends_on:
        #     api:
        #       condition: service_healthy
        #   entrypoint: /bin/sh -c
        #   command: |
        #     "
        #       curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        #       curl -k -X POST -H \"Content-Type: text/plain\" --data @cpa.xml https://overheid:8443/service/rest/v19/cpas?overwrite=true
        #     "
  activemq:
    image: apache/activemq-classic:6.1.8
    ports:
      - "8161:8161"
      # - "61616:61616"
    volumes:
      - ./activemq.xml:/opt/apache-activemq/conf/activemq.xml
      #   - ./data:/opt/apache-activemq/data
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ebms
      POSTGRES_PASSWORD: ebms
      POSTGRES_DB: ebms
    # ports:
    #   - "5432:5432"
    volumes:
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
      # - ./data:/var/lib/postgresql/data
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
