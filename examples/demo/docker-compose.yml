services:
  digipoort:
    image: eluinstra/ebms-adapter-test:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      database_start: "true"
      ebms_jdbc_update: "true"
      # command: sh -c "curl -OL https://github.com/eluinstra/ebms-admin/releases/download/ebms-admin-2.20.8/ebms-h2-db-plugin-2.20.8.jar && export CLASSPATH=ebms-h2-db-plugin-2.20.8.jar && ./start.sh -soap -health"
    command: "./start.sh -soap -health"
    expose:
      - 8080
      - 8888
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  digipoort_init:
    image: alpine/curl:latest
    depends_on:
      digipoort:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://digipoort:8080/service/rest/v19/cpas?overwrite=true
      "
  overheid:
    image: eluinstra/ebms-adapter-test:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      database_start: "true"
      ebms_jdbc_update: "true"
    command: "./start.sh -soap -health"
    expose:
      - 8080
      - 8888
    ports:
      - "8088:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  overheid_init:
    image: alpine/curl:latest
    depends_on:
      overheid:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://overheid:8080/service/rest/v19/cpas?overwrite=true
      "
