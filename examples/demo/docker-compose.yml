services:
  digipoort:
    image: eluinstra/ebms-adapter-test:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      database_start: "true"
      ebms_jdbc_update: "true"
      # add plugin jars with: JAVA_ARGS="$JAVA_ARGS -cp <plugin>.jar" or CLASSPATH=..., then ./start.sh
    # -soap/-health CLI args are no-ops on the ebms-server main class; connectors
    # are enabled with -D flags via JAVA_ARGS (api.soap.enabled defaults true).
    environment:
      JAVA_ARGS: "-Dlog4j.configurationFile=log4j2.xml -Dapi.health.enabled=true"
    command: "./start.sh"
    expose:
      - 8080
      - 8888
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  digipoort_init:
    image: alpine/curl:latest
    depends_on:
      digipoort:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://digipoort:8080/service/rest/v19/cpas?overwrite=true
      "
  overheid:
    image: eluinstra/ebms-adapter-test:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      database_start: "true"
      ebms_jdbc_update: "true"
    # -soap/-health CLI args are no-ops on the ebms-server main class; connectors
    # are enabled with -D flags via JAVA_ARGS (api.soap.enabled defaults true).
    environment:
      JAVA_ARGS: "-Dlog4j.configurationFile=log4j2.xml -Dapi.health.enabled=true"
    command: "./start.sh"
    expose:
      - 8080
      - 8888
    ports:
      - "8088:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  overheid_init:
    image: alpine/curl:latest
    depends_on:
      overheid:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://overheid:8080/service/rest/v19/cpas?overwrite=true
      "
