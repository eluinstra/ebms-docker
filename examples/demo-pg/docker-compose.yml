services:
  digipoort:
    image: eluinstra/ebms-adapter-pg:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      ebms_jdbc_update: "true"
      ebms_jdbc_url: "jdbc:postgresql://postgres-digipoort:5432/ebms"
      ebms_jdbc_username: "ebms"
      ebms_jdbc_password: "ebms"
    command: "./start.sh -soap -health"
    expose:
      - 8080
      - 8888
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl -f http://localhost:8008/health"
      start_period: 3s
      interval: 5s
      timeout: 5s
      retries: 10
  digipoort_init:
    image: alpine/curl:latest
    depends_on:
      digipoort:
        condition: service_healthy
    entrypoint: /bin/sh -c
    command: |
      "
        curl -L https://raw.githubusercontent.com/eluinstra/ebms-docker/refs/heads/2.20.x/examples/cpa.xml -o cpa.xml && \
        curl -X POST -H \"Content-Type: text/plain\" --data @cpa.xml http://digipoort:8080/service/rest/v19/cpas?overwrite=true
      "
  postgres-digipoort:
    image: postgres:18
    environment:
      POSTGRES_USER: ebms
      POSTGRES_PASSWORD: ebms
      POSTGRES_DB: ebms
    # ports:
    #   - "5432:5432"
    # volumes:
    #   - ./data:/var/lib/postgresql/data
  overheid:
    image: eluinstra/ebms-adapter-pg:${EBMS_VERSION}
    environment:
      ebms_verifyHostnames: "false"
      https_verifyHostnames: "false"
      cache_type: "PLUGIN"
      jms_broker_start: "true"
      eventListener_type: "JMS"
      ebms_jdbc_update: "true"
      ebms_jdbc_url: "jdbc:postgresql://postgres-overheid:5432/ebms"
      ebms_jdbc_username: "ebms"
      ebms_jdbc_password: "ebms"
    command: "./start.sh -ssl -soap -health"
    expose:
      - 8443
      - 8888
    ports:
      - "8443:8443"
    depends_on:
      - postgres-overheid
  #   healthcheck:
  #     test: "curl -f http://localhost:8008/health"
  #     start_period: 3s
  #     interval: 5s
  #     timeout: 5s
